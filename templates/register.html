<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/static/main.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/register_style.css">
    <title>Register</title>
  </head>
  <body>
    <div class="container">
      <!-- Artwork side -->
      <div class="art-panel">
        <svg class="motif" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
          <g fill="none" stroke="#EADFC8" stroke-width="2">
            <!-- compass rose / globe -->
            <circle cx="90" cy="90" r="52"/>
            <circle cx="90" cy="90" r="52" stroke="#C9A227" stroke-dasharray="2 6"/>
            <path d="M90 38 L90 142 M38 90 L142 90" stroke-width="1"/>
            <path d="M90 20 L98 60 L90 90 L82 60 Z" fill="#C9A227" stroke="none" opacity="0.9"/>
            <path d="M20 90 L60 82 L90 90 L60 98 Z" opacity="0.7"/>
            <path d="M90 160 L82 120 L90 90 L98 120 Z" opacity="0.7"/>
            <path d="M160 90 L120 98 L90 90 L120 82 Z" opacity="0.7"/>

            <!-- mountain range -->
            <path d="M20 260 L70 200 L110 250 L150 190 L200 260 Z"/>
            <!-- ocean waves -->
            <path d="M0 300 Q40 280 80 300 T160 300 T240 300 T320 300 T400 300" />
            <path d="M0 320 Q40 300 80 320 T160 320 T240 320 T320 320 T400 320" />
            <!-- arch -->
            <path d="M250 260 L250 210 A40 40 0 0 1 330 210 L330 260" />
            <!-- pagoda roofline -->
            <path d="M260 420 L300 380 L340 420 M270 400 L330 400" stroke="#C9A227"/>
            <!-- sun -->
            <circle cx="320" cy="140" r="18" stroke="#C9A227"/>
            <path d="M320 108 L320 118 M320 162 L320 172 M288 140 L298 140 M342 140 L352 140" stroke="#C9A227"/>

            <circle cx="60" cy="440" r="3" fill="#C9A227" stroke="none"/>
            <circle cx="180" cy="460" r="3" fill="#C9A227" stroke="none"/>
            <circle cx="360" cy="440" r="4" fill="#C9A227" stroke="none"/>
          </g>
        </svg>
        <div>
          <div class="art-eyebrow">Worldwide Travel Platform</div>
          <div class="art-title">Tourism Company</div>
          <div class="art-sub">Create your account to start planning journeys across the world's cultures — from the temples of Kyoto to the ruins of Machu Picchu.</div>
        </div>
        <div class="art-footer">Kyoto &middot; Marrakech &middot; Machu Picchu &middot; Santorini &middot; Cape Town</div>
      </div>

      <!-- Form side -->
      <div class="input-form">
        <h2 class="center">Tourism Company</h2>
        <form action="/register" method="POST">
          <table class="center">
            <h3 class="center">Register Yourself to Explore</h3>
            <tr>
              <td><label>Email: </label></td>
              <td><input type="email" name="emailid" placeholder="you@example.com" /></td>
            </tr>
            <tr>
              <td><label>Password: </label></td>
              <td><input type="password" name="pwd" placeholder="••••••••" /></td>
            </tr>
            <tr>
              <td><label>Name: </label></td>
              <td><input type="text" name="fname" placeholder="Full name" /></td>
            </tr>
            <tr>
              <td><label>User Type: </label></td>
              <td>
                <select name="utype">
                  <option value="User">User</option>
                  <option value="Staff">Staff</option>
                </select>
              </td>
            </tr>
            <tr>
              <td><label>Address: </label></td>
              <td><textarea name="address" rows="5" cols="20"></textarea></td>
            </tr>
            <tr>
              <td><label>Phone no: </label></td>
              <td><input type="text" name="phno" placeholder="+91 00000 00000" /></td>
            </tr>
            <tr>
              <td><input type="Submit" value="Signup" /></td>
              <td><a href="/login">Existing User</a></td>
            </tr>
          </table>
        </form>
      </div>
    </div>
  </body>
</html>
